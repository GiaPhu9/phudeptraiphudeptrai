<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101820, #172a3a);
    color: white;
}

.game-container {
    width: min(95vw, 520px);
    text-align: center;
}

h1 {
    margin: 0 0 15px;
    font-size: 42px;
    color: #5cff72;
    text-shadow: 0 0 15px #27ff4c;
}

.score-board {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 12px 18px;
    background: #1e3446;
    border-radius: 12px;
    font-size: 18px;
}

canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    background: #0b1117;
    border: 3px solid #42ff63;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(66,255,99,.3);
}

button {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    background: #25c94a;
    font-weight: bold;
}

#restart {
    margin-top: 15px;
    padding: 12px 25px;
    font-size: 17px;
}

button:hover {
    background: #1de044;
    transform: scale(1.03);
}

.controls {
    margin: 18px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 65px);
    gap: 8px;
    justify-content: center;
}

.controls button {
    width: 65px;
    height: 55px;
    font-size: 22px;
}

.empty {
    visibility: hidden;
}

#message {
    min-height: 28px;
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
    color: #ffdc4a;
}
</style>
</head>

<body>

<div class="game-container">
    <h1>🐍 SNAKE</h1>

    <div class="score-board">
        <div>Điểm: <b id="score">0</b></div>
        <div>Kỷ lục: <b id="highScore">0</b></div>
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <div id="message">Dùng phím mũi tên hoặc WASD để chơi</div>

    <button id="restart">🔄 Chơi lại</button>

    <div class="controls">
        <button class="empty"></button>
        <button onclick="changeDirection('up')">⬆️</button>
        <button class="empty"></button>

        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 25;
const tile = canvas.width / grid;

let snake;
let food;
let direction;
let nextDirection;
let score;
let gameOver;
let gameLoop;

let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
document.getElementById("highScore").textContent = highScore;

function startGame() {
    snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
    ];

    direction = "right";
    nextDirection = "right";
    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent =
        "Dùng phím mũi tên hoặc WASD để chơi";

    createFood();

    clearInterval(gameLoop);
    gameLoop = setInterval(update, 110);

    draw();
}

function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * grid),
            y: Math.floor(Math.random() * grid)
        };
    } while (
        snake.some(part => part.x === food.x && part.y === food.y)
    );
}

function changeDirection(newDirection) {
    const opposites = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (opposites[newDirection] !== direction) {
        nextDirection = newDirection;
    }
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: "up",
        w: "up",
        W: "up",

        ArrowDown: "down",
        s: "down",
        S: "down",

        ArrowLeft: "left",
        a: "left",
        A: "left",

        ArrowRight: "right",
        d: "right",
        D: "right"
    };

    if (keys[e.key]) {
        e.preventDefault();
        changeDirection(keys[e.key]);
    }

    if (e.key === "Enter" && gameOver) {
        startGame();
    }
});

function update() {
    direction = nextDirection;

    const head = { ...snake[0] };

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    // Đâm tường
    if (
        head.x < 0 ||
        head.x >= grid ||
        head.y < 0 ||
        head.y >= grid
    ) {
        endGame();
        return;
    }

    // Đâm vào thân
    if (
        snake.some(part =>
            part.x === head.x && part.y === head.y
        )
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    // Ăn thức ăn
    if (head.x === food.x && head.y === food.y) {
        score++;

        document.getElementById("score").textContent = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            document.getElementById("highScore").textContent = highScore;
        }

        createFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    // Nền
    ctx.fillStyle = "#0b1117";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Lưới
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= grid; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tile, 0);
        ctx.lineTo(i * tile, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tile);
        ctx.lineTo(canvas.width, i * tile);
        ctx.stroke();
    }

    // Thức ăn
    ctx.fillStyle = "#ff3b4f";
    ctx.shadowColor = "#ff3b4f";
    ctx.shadowBlur = 15;

    ctx.beginPath();
    ctx.arc(
        food.x * tile + tile / 2,
        food.y * tile + tile / 2,
        tile * 0.35,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    // Rắn
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#75ff8a" : "#2fd653";

        const padding = 2;

        ctx.beginPath();
        ctx.roundRect(
            part.x * tile + padding,
            part.y * tile + padding,
            tile - padding * 2,
            tile - padding * 2,
            6
        );
        ctx.fill();

        // Mắt
        if (index === 0) {
            ctx.fillStyle = "#102018";

            let eye1X = part.x * tile + tile * 0.35;
            let eye2X = part.x * tile + tile * 0.65;
            let eyeY = part.y * tile + tile * 0.35;

            if (direction === "left") {
                eye1X = part.x * tile + tile * 0.35;
                eye2X = eye1X;
                eyeY = part.y * tile + tile * 0.35;
            }

            ctx.beginPath();
            ctx.arc(eye1X, eyeY, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(eye2X, eyeY + tile * 0.3, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function endGame() {
    gameOver = true;
    clearInterval(gameLoop);

    document.getElementById("message").textContent =
        `💥 Game Over! Bạn được ${score} điểm — nhấn Chơi lại`;

    draw();

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";

    ctx.font = "bold 42px Arial";
    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2 - 15
    );

    ctx.font = "22px Arial";
    ctx.fillText(
        `Điểm: ${score}`,
        canvas.width / 2,
        canvas.height / 2 + 30
    );
}

document.getElementById("restart").addEventListener(
    "click",
    startGame
);

startGame();
</script>

</body>
</html>
